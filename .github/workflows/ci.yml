name: cipherpost-ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install backend deps (pinned)
        run: |
          pip install -r backend/requirements.txt
          pip install pip-audit
          pip check
      - name: Backend test suite
        run: PYTHONPATH=backend/. python -m pytest backend/tests -q
      - name: Rules eval — synthetic corpus only (not real-world)
        run: PYTHONPATH=backend/. python -m app.parsing.eval_rules tests/fixtures
      - name: ML eval — synthetic corpus only
        run: PYTHONPATH=backend/. python -m app.ml.eval_ml tests/fixtures
      - name: Real-data eval harness (empty manifest, informational)
        run: PYTHONPATH=backend python scripts/eval_real.py tests/real/manifest.json
      - name: Dependency vulnerability scan
        run: pip-audit -r backend/requirements.txt

  migrate-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cipherpost
          POSTGRES_USER: cipherpost
          POSTGRES_PASSWORD: cipherpost
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U cipherpost"
          --health-interval=5s --health-timeout=3s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install backend deps (pinned)
        run: pip install -r backend/requirements.txt
      - name: Upgrade empty Postgres to head
        env:
          CIPHERPOST_DATABASE_URL_SYNC: postgresql+psycopg2://cipherpost:cipherpost@localhost:5432/cipherpost
        run: PYTHONPATH=backend python -m app.migrate
      - name: Check no model/migration drift
        env:
          CIPHERPOST_DATABASE_URL_SYNC: postgresql+psycopg2://cipherpost:cipherpost@localhost:5432/cipherpost
        run: PYTHONPATH=backend alembic -c backend/alembic.ini check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check + build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t cipherpost/api:ci .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: cipherpost/api:ci
          format: table
          severity: CRITICAL,HIGH

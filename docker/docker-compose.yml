version: "3.9"

services:
  # NOTE: local compose only — CIPHERPOST_ENV=dev relaxes secret checks.
  # Never use dev in production; production defaults to refusing weak secrets.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cipherpost
      POSTGRES_USER: cipherpost
      # Never hardcode production passwords: override via POSTGRES_PASSWORD env
      # (compose reads .env). Default is local-dev only.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cipherpost}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No published ports by default (internal only). For local psql, use:
    #   docker compose -f docker/docker-compose.yml run --rm db psql -U cipherpost
    # Or temporarily add ["127.0.0.1:5432:5432"].
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cipherpost"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # No published ports by default (internal only). For local redis-cli, use:
    #   docker compose -f docker/docker-compose.yml run --rm redis redis-cli -h redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    user: "10001:10001"
    command: ["python", "-m", "app.migrate"]
    environment:
      CIPHERPOST_DATABASE_URL_SYNC: postgresql+psycopg2://cipherpost:${POSTGRES_PASSWORD:-cipherpost}@db:5432/cipherpost
      CIPHERPOST_ENV: dev
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      CIPHERPOST_DATABASE_URL: postgresql+asyncpg://cipherpost:${POSTGRES_PASSWORD:-cipherpost}@db:5432/cipherpost
      CIPHERPOST_DATABASE_URL_SYNC: postgresql+psycopg2://cipherpost:${POSTGRES_PASSWORD:-cipherpost}@db:5432/cipherpost
      CIPHERPOST_REDIS_URL: redis://redis:6379/0
      CIPHERPOST_CELERY_BROKER_URL: redis://redis:6379/0
      CIPHERPOST_CELERY_RESULT_BACKEND: redis://redis:6379/0
      CIPHERPOST_TRUSTED_CA_BUNDLE_PATH: /app/tests/fixtures/trusted_root.pem
      CIPHERPOST_ENV: dev
      CIPHERPOST_LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - upload_data:/data/uploads
      - report_data:/data/reports
      - capture_data:/data/capture
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/v1/health', timeout=2).raise_for_status()"]
      interval: 10s
      retries: 5

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    environment:
      CIPHERPOST_DATABASE_URL: postgresql+asyncpg://cipherpost:${POSTGRES_PASSWORD:-cipherpost}@db:5432/cipherpost
      CIPHERPOST_DATABASE_URL_SYNC: postgresql+psycopg2://cipherpost:${POSTGRES_PASSWORD:-cipherpost}@db:5432/cipherpost
      CIPHERPOST_REDIS_URL: redis://redis:6379/0
      CIPHERPOST_CELERY_BROKER_URL: redis://redis:6379/0
      CIPHERPOST_CELERY_RESULT_BACKEND: redis://redis:6379/0
      CIPHERPOST_TRUSTED_CA_BUNDLE_PATH: /app/tests/fixtures/trusted_root.pem
      CIPHERPOST_ENV: dev
      CIPHERPOST_LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - upload_data:/data/uploads
      - report_data:/data/reports
    restart: unless-stopped

  # --- live acquisition (host network for SPAN/TAP; see README) ---
  capture:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    # For real SPAN/TAP deployment use network_mode: host and cap_add
    # network_mode: host  # uncomment for host capture
    # cap_add: [NET_RAW, NET_ADMIN]
    command: ["python", "-m", "app.live.capture", "--iface", "eth0"]
    environment:
      CIPHERPOST_DATABASE_URL: postgresql+asyncpg://cipherpost:${POSTGRES_PASSWORD:-cipherpost}@db:5432/cipherpost
      CIPHERPOST_DATABASE_URL_SYNC: postgresql+psycopg2://cipherpost:${POSTGRES_PASSWORD:-cipherpost}@db:5432/cipherpost
      CIPHERPOST_REDIS_URL: redis://redis:6379/0
      CIPHERPOST_LIVE_IFACE: eth0
      CIPHERPOST_RAW_CAPTURE_DIR: /data/capture
      CIPHERPOST_RAW_RETENTION_SECONDS: 21600
      CIPHERPOST_TRUSTED_CA_BUNDLE_PATH: /app/tests/fixtures/trusted_root.pem
      CIPHERPOST_ENV: dev
      CIPHERPOST_LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - capture_data:/data/capture
    restart: unless-stopped

  analyzer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    command: ["python", "-m", "app.live.analyze"]
    environment:
      CIPHERPOST_DATABASE_URL: postgresql+asyncpg://cipherpost:${POSTGRES_PASSWORD:-cipherpost}@db:5432/cipherpost
      CIPHERPOST_DATABASE_URL_SYNC: postgresql+psycopg2://cipherpost:${POSTGRES_PASSWORD:-cipherpost}@db:5432/cipherpost
      CIPHERPOST_REDIS_URL: redis://redis:6379/0
      CIPHERPOST_TRUSTED_CA_BUNDLE_PATH: /app/tests/fixtures/trusted_root.pem
      CIPHERPOST_ENV: dev
      CIPHERPOST_LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  alerter:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    command: ["python", "-m", "app.live.alerts"]
    environment:
      CIPHERPOST_REDIS_URL: redis://redis:6379/0
      CIPHERPOST_DATABASE_URL_SYNC: postgresql+psycopg2://cipherpost:${POSTGRES_PASSWORD:-cipherpost}@db:5432/cipherpost
      CIPHERPOST_ALERT_MIN_SEVERITY: high
      CIPHERPOST_ENV: dev
      CIPHERPOST_ALERT_WEBHOOK_URL: ${CIPHERPOST_ALERT_WEBHOOK_URL:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Replay demo: feeds fixtures through live pipeline (no privileges needed)
  replay:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    command: ["python", "scripts/replay_harness.py", "tests/fixtures", "--mode", "capture"]
    volumes:
      - ../tests/fixtures:/app/tests/fixtures:ro
      - ../scripts:/app/scripts:ro
    environment:
      CIPHERPOST_REDIS_URL: redis://redis:6379/0
      CIPHERPOST_DATABASE_URL_SYNC: postgresql+psycopg2://cipherpost:${POSTGRES_PASSWORD:-cipherpost}@db:5432/cipherpost
      CIPHERPOST_ENV: dev
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["replay"]

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
  upload_data:
  report_data:
  capture_data:

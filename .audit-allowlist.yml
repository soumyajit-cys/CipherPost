# id (tool advisory/VULN id or fingerprint), justification (why it is safe
# to ship), expires (YYYY-MM-DD; CI fails past expiry via scripts/check_allowlist.py).
# Prefer upgrading over ignoring. Empty lists mean: no ignores active.
pip: []
npm: []
secrets: []

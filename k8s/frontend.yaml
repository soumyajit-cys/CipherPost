apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cipherpost
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: cipherpost/frontend:latest
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: cipherpost
spec:
  selector: { app: frontend }
  ports: [{ port: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cipherpost
  namespace: cipherpost
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "512m"
spec:
  rules:
    - host: cipherpost.example.com   # <-- change to your domain
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: api, port: { number: 8000 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { number: 80 } } }

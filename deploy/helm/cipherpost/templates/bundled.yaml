{{- /* Bundled Postgres/Redis: EVALUATION ONLY. Production must use external. */ -}}
{{- if .Values.postgres.bundled.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "cipherpost.labels" . | nindent 4 }}
  annotations:
    cipherpost.io/eval-only: "true - use external Postgres in production"
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "cipherpost.selectorLabels" . | nindent 6 }}
      app: postgres
  template:
    metadata:
      labels:
        {{- include "cipherpost.selectorLabels" . | nindent 8 }}
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - name: POSTGRES_DB
              value: cipherpost
            - name: POSTGRES_USER
              value: cipherpost
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecretRefs.app | quote }}
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: {{ .Values.postgres.bundled.storage | quote }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "cipherpost.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "cipherpost.selectorLabels" . | nindent 4 }}
    app: postgres
  ports: [{ port: 5432 }]
{{- end }}
{{- if .Values.redis.bundled.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-redis
  labels: {{- include "cipherpost.labels" . | nindent 4 }}
  annotations:
    cipherpost.io/eval-only: "true - use external Redis in production"
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "cipherpost.selectorLabels" . | nindent 6 }}
      app: redis
  template:
    metadata:
      labels:
        {{- include "cipherpost.selectorLabels" . | nindent 8 }}
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-redis
  labels: {{- include "cipherpost.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "cipherpost.selectorLabels" . | nindent 4 }}
    app: redis
  ports: [{ port: 6379 }]
{{- end }}

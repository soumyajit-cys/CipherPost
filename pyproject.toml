[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cipherpost"
dynamic = ["version"]
description = "Passive TLS forensics for email infrastructure (SMTP/IMAP/POP3)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD — see docs/licensing-decision.md (no license chosen yet)" }
keywords = ["tls", "email", "smtp", "forensics", "security"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
  "dpkt>=1.9.8",
  "scapy>=2.5.0",
  "cryptography>=41.0.0",
  "pyOpenSSL>=23.3.0",
  "dnspython>=2.6.0",
  "httpx>=0.25.0",
  "pydantic>=2.5.0",
  "pydantic-settings>=2.1.0",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.104.0",
  "uvicorn[standard]>=0.24.0",
  "celery[redis]>=5.3.0",
  "redis>=5.0.0",
  "sqlalchemy[asyncio]>=2.0.23",
  "asyncpg>=0.29.0",
  "psycopg2-binary>=2.9.0",
  "PyJWT>=2.8.0",
  "alembic>=1.12.0",
  "scikit-learn>=1.3.0",
  "shap>=0.44.0",
  "jinja2>=3.1.0",
  "weasyprint>=60.0",
  "prometheus-client>=0.19.0",
  "structlog>=23.2.0",
]

[project.scripts]
cipherpost = "app.cli:main"
cipherpost-agent = "app.agent.agent:main"
cipherpost-migrate = "app.migrate:main"

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.setuptools.dynamic]
version = { attr = "app.core.config.APP_VERSION" }

[tool.pytest.ini_options]
markers = [
  "slow: failure-injection/soak tests (nightly)",
]

services:
  # --- Mail Infrastructure ---
  postfix:
    image: mailserver:latest
    container_name: cipherpost-postfix
    ports:
      - "25:25"
      - "587:587"
      - "465:465"
    environment:
      - MAIL_HOSTNAME=lab.local
      - SAILS_DOMAIN=lab.local
      - NET_TYPE=mail
      - SASL_EMAIL
      - SASL_USER=admin
      - SASL_PASS=password
    volumes:
      - ./postfix/mail:/var/mail
      - ./postfix/config:/etc/postfix
      - ./postfix/state:/var/lib/postfix
    networks:
      - mail
    profiles:
      - modern
      - legacy-tolerant
      - deliberately-broken

  dovecot:
    image: mailserver:latest
    container_name: cipherpost-dovecot
    ports:
      - "993:993"
      - "995:995"
    environment:
      - MAIL_HOSTNAME=lab.local
      - SAILS_DOMAIN=lab.local
      - NET_TYPE=mail
      - SASL_EMAIL
      - SASL_USER=admin
      - SASL_PASS=password
    volumes:
      - ./dovecot/mail:/var/mail
      - ./dovecot/config:/etc/dovecot
      - ./dovecot/state:/var/lib/dovecot
    networks:
      - mail
    profiles:
      - modern
      - legacy-tolerant
      - deliberately-broken

  # --- CipherPost Stack ---
  db:
    image: postgres:16-alpine
    container_name: cipherpost-db
    environment:
      - POSTGRES_USER=cipherpost
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=cipherpost
    networks:
      - mail

  redis:
    image: redis:7-alpine
    container_name: cipherpost-redis
    networks:
      - mail

  api:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.api
    container_name: cipherpost-api
    environment:
      - CIPHERPOST_ENV=dev
      - CIPHERPOST_DATABASE_URL=postgresql+asyncpg://cipherpost:password@db:5432/cipherpost
      - CIPHERPOST_DATABASE_URL_SYNC=postgresql+psycopg2://cipherpost:password@db:5432/cipherpost
      - CIPHERPOST_REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    networks:
      - mail

networks:
  mail:
    driver: bridge

# In-cluster Postgres + Redis for small deployments.
# Production: replace with managed services (RDS/Cloud SQL + ElastiCache/
# Memorystore) and point the Secret URLs at them.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: cipherpost
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: cipherpost }
            - { name: POSTGRES_USER, value: cipherpost }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: cipherpost-secrets, key: POSTGRES_PASSWORD } }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 2Gi }
          volumeMounts: [{ name: pgdata, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: pgdata }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 50Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cipherpost
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: cipherpost
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: cipherpost
spec:
  selector: { app: redis }
  ports: [{ port: 6379 }]

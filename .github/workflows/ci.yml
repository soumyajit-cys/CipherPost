name: cipherpost-ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install backend deps (pinned)
        run: |
          pip install -r backend/requirements.txt
          pip install pip-audit
          pip check
      - name: Backend test suite (fast; chaos runs nightly)
        run: PYTHONPATH=backend/. python -m pytest backend/tests -q -m "not slow"
      - name: Rules eval — synthetic corpus only (not real-world)
        run: PYTHONPATH=backend/. python -m app.parsing.eval_rules tests/fixtures
      - name: ML eval — synthetic corpus only
        run: PYTHONPATH=backend/. python -m app.ml.eval_ml tests/fixtures
      - name: Real-data eval harness (empty manifest, informational)
        run: PYTHONPATH=backend python scripts/eval_real.py tests/real/manifest.json
      - name: OpenAPI breaking-change gate
        run: PYTHONPATH=backend python scripts/check_openapi_break.py
      - name: Dependency vulnerability scan
        run: pip-audit -r backend/requirements.txt
      - name: Audit allowlist gate
        run: python scripts/check_allowlist.py

  migrate-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cipherpost
          POSTGRES_USER: cipherpost
          POSTGRES_PASSWORD: cipherpost
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U cipherpost"
          --health-interval=5s --health-timeout=3s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install backend deps (pinned)
        run: pip install -r backend/requirements.txt
      - name: Upgrade empty Postgres to head
        env:
          CIPHERPOST_DATABASE_URL_SYNC: postgresql+psycopg2://cipherpost:cipherpost@localhost:5432/cipherpost
        run: PYTHONPATH=backend python -m app.migrate
      - name: Check no model/migration drift
        env:
          CIPHERPOST_DATABASE_URL_SYNC: postgresql+psycopg2://cipherpost:cipherpost@localhost:5432/cipherpost
        run: PYTHONPATH=backend alembic -c backend/alembic.ini check

  restore-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cipherpost
          POSTGRES_USER: cipherpost
          POSTGRES_PASSWORD: cipherpost
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U cipherpost"
          --health-interval=5s --health-timeout=3s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install backend deps (pinned)
        run: pip install -r backend/requirements.txt
      - name: Migrate, seed one row, backup, wipe, restore, verify
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: cipherpost
          PGPASSWORD: cipherpost
          PGDATABASE: cipherpost
          CIPHERPOST_DATABASE_URL_SYNC: postgresql+psycopg2://cipherpost:cipherpost@localhost:5432/cipherpost
        run: |
          PYTHONPATH=backend python -m app.migrate
          PYTHONPATH=backend python -c "
          from sqlalchemy import create_engine, text
          e = create_engine('postgresql+psycopg2://cipherpost:cipherpost@localhost:5432/cipherpost')
          import uuid
          oid = 'org-' + uuid.uuid4().hex[:12]
          with e.begin() as c:
              c.execute(text(\"INSERT INTO organizations (id, name) VALUES (:i, 'default') ON CONFLICT DO NOTHING\"), {'i': oid})
              n = c.execute(text('SELECT COUNT(*) FROM organizations')).scalar()
              print('orgs before backup:', n)
              assert n >= 1
          "
          bash scripts/backup_postgres.sh /tmp/restore-ci
          ls -la /tmp/restore-ci
          DUMP=$(ls -1t /tmp/restore-ci/cipherpost-*.dump | head -n 1)
          psql -h localhost -U cipherpost -d cipherpost -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          bash scripts/restore_postgres.sh --yes "$DUMP"
          PYTHONPATH=backend python -c "
          from sqlalchemy import create_engine, text
          e = create_engine('postgresql+psycopg2://cipherpost:cipherpost@localhost:5432/cipherpost')
          with e.connect() as c:
              n = c.execute(text('SELECT COUNT(*) FROM organizations')).scalar()
              print('orgs after restore:', n)
              assert n >= 1, 'row counts did not survive restore'
          "
          PYTHONPATH=backend python -m app.migrate
          PYTHONPATH=backend alembic -c backend/alembic.ini check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check + build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install helm (no sudo)
        run: |
          curl -fsSL -o /tmp/helm.tar.gz https://get.helm.sh/helm-v4.0.0-linux-amd64.tar.gz
          tar xzf /tmp/helm.tar.gz -C /tmp
          echo "/tmp/linux-amd64" >> "$GITHUB_PATH"
      - name: Install kubeconform
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xzf /tmp/kubeconform.tar.gz -C /tmp
          echo "/tmp" >> "$GITHUB_PATH"
      - name: Helm lint
        run: helm lint deploy/helm/cipherpost
      - name: Helm template (defaults + full values)
        run: |
          helm template cp-ci deploy/helm/cipherpost --namespace cipherpost > /tmp/cp-ci.yaml
          helm template cp-full deploy/helm/cipherpost --namespace cipherpost \
            --set ingress.enabled=true --set monitoring.serviceMonitor.enabled=true \
            --set monitoring.prometheusRules.enabled=true \
            --set postgres.bundled.enabled=true --set redis.bundled.enabled=true \
            --set autoscaling.analyzer.enabled=false > /tmp/cp-full.yaml
      - name: Kubeconform strict
        # NOTE: no kind-cluster install test (see report). ServiceMonitor/
        # PrometheusRule are operator CRDs without public schemas: skipped.
        run: |
          kubeconform -strict -summary /tmp/cp-ci.yaml
          kubeconform -summary -skip ServiceMonitor,PrometheusRule /tmp/cp-full.yaml

  container-scan:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t cipherpost/api:ci .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: cipherpost/api:ci
          format: table
          severity: CRITICAL,HIGH
